aid: jerry
name: Jerry
description: 'Jerry (Jerry Services, Inc. / Jerry Insurance Agency, LLC) is a Palo
  Alto, California based AI-powered car ownership super app and the largest digital
  car insurance broker in the United States, licensed as an insurance producer in all
  50 states and the District of Columbia. Through its iOS and Android apps and jerry.ai,
  Jerry compares real car, home, renters and motorcycle insurance quotes from 100+
  carriers, surfaces applicable discounts, and handles buying, bundling, switching
  and cancelling policies end to end. Beyond insurance the app bundles auto refinancing,
  the GarageGuard repair-cost and maintenance toolset, PriceProtect rate monitoring,
  and the phone-sensor DriveShield telematics safe-driving program. Founded in 2017
  by Art Agrawal, Lina Zhang and Musawir Shah, Jerry serves more than five million
  customers. Jerry publishes no public developer API, developer portal or machine-readable
  API contract; its public machine-readable surface is limited to an OpenID Connect
  discovery document, a published llms.txt, a Content Signals declaration in robots.txt,
  an Upptime-backed status page and a Vanta trust center.'
